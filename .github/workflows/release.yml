name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: macos-app
            spec: build_macos.spec
          - name: Windows
            os: windows-latest
            artifact: windows-exe
            spec: build_windows.spec
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt
      - name: Build application
        run: pyinstaller --noconfirm ${{ matrix.spec }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Автокликер.app dist/Автокликер-macOS.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && 'dist/Автокликер-macOS.zip' || 'dist/Автокликер.exe' }}

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
