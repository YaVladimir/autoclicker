name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: macos-app
            spec: build_macos.spec
          - name: Windows
            os: windows-latest
            artifact: windows-exe
            spec: build_windows.spec
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows.txt
      - name: Test Windows detector and click engine
        if: runner.os == 'Windows'
        env:
          RUN_WINDOWS_UI_SMOKE: "1"
        run: python -m unittest discover -s tests -v
      - name: Test macOS controller and native imports
        if: runner.os == 'macOS'
        run: |
          python -m unittest tests.test_macos_core tests.test_macos_controller -v
          python -c "import macos_cocoa_ui"
      - name: Build application
        run: pyinstaller --noconfirm ${{ matrix.spec }}
      - name: Verify Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AUTOCLICKER_SELF_CHECK_REPORT = Join-Path $env:RUNNER_TEMP "autoclicker-self-check.txt"
          $dependencyCheck = Start-Process -FilePath "dist\Автокликер.exe" -ArgumentList "--check-golden-detector" -WindowStyle Hidden -Wait -PassThru
          if ($dependencyCheck.ExitCode -ne 0) { throw "Golden-cookie detector self-check failed: $(Get-Content $env:AUTOCLICKER_SELF_CHECK_REPORT -Raw)" }
          $windowSmoke = Start-Process -FilePath "dist\Автокликер.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($windowSmoke.ExitCode -ne 0) { throw "Windows GUI smoke test failed." }
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Автокликер.app dist/Автокликер-macOS.zip
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && 'dist/Автокликер-macOS.zip' || 'dist/Автокликер.exe' }}

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-files/*
