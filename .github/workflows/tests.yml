name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-windows.txt
      - name: Install native macOS dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt
      - name: Verify native macOS module imports
        if: runner.os == 'macOS'
        run: python -c "import macos_cocoa_ui"
      - run: python -m unittest discover -s tests -v
        env:
          RUN_WINDOWS_UI_SMOKE: ${{ runner.os == 'Windows' && '1' || '0' }}
