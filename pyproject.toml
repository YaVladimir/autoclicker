[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-clicker-autoclicker"
version = "1.0.1"
description = "A small desktop autoclicker for Cookie Clicker and other clicker games"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Cookie Clicker Autoclicker contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
macos = [
    "pyobjc-core==10.3.2; platform_system == 'Darwin'",
    "pyobjc-framework-Cocoa==10.3.2; platform_system == 'Darwin'",
    "pyobjc-framework-Quartz==10.3.2; platform_system == 'Darwin'",
]

[project.scripts]
cookie-clicker-autoclicker-macos = "autoclicker_macos:main"

[tool.setuptools]
py-modules = ["autoclicker", "autoclicker_macos", "macos_cocoa_ui"]
